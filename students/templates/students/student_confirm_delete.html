
{% extends "students/base.html" %}

{% block title %}Delete Student{% endblock %}

{% block content %}
<section class="panel">
    <h2>Delete Student</h2>

    <p>Are you sure you want to delete {{ student.name }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="delete-btn">
            Confirm Delete
        </button>

        <a href="{% url 'student_list' %}"
           class="secondary-btn">
            Cancel
        </a>
    </form>
</section>
{% endblock %}
